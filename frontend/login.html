<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="text-center mb-2">
                <h1 class="navbar-brand" style="font-size: 2rem; margin-bottom: 0.5rem;">NEXUS</h1>
                <p style="color: var(--text-muted)">Welcome back to your workspace</p>
            </div>
            <form id="loginForm">
                <div id="loginError"
                    style="color: var(--danger); margin-bottom: 1rem; text-align: center; display: none;"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Sign In</button>
                <div class="text-center mt-1" style="font-size: 0.875rem;">
                    <span style="color: var(--text-muted)">Don't have an account?</span>
                    <a href="#" id="showSignup"
                        style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign up</a>
                </div>
            </form>
            <form id="signupForm" class="hidden">
                <div id="signupError"
                    style="color: var(--danger); margin-bottom: 1rem; text-align: center; display: none;"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="signupRole" class="form-control">
                        <option value="Member">Member</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Create Account</button>
                <div class="text-center mt-1" style="font-size: 0.875rem;">
                    <span style="color: var(--text-muted)">Already have an account?</span>
                    <a href="#" id="showLogin"
                        style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
